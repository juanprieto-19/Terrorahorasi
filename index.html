<title>Entre sombras y estrellas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap">
<style>
/* Layout: escenas a pantalla completa, una visible a la vez. Estética de cuento de Burton: azul ceniza, rayas, espirales, ramas retorcidas */
:root {
  --night: #0d1018;
  --night-2: #1a2030;
  --ash: #8da2b8;
  --moon: #e8e6d8;
  --blue: #7fc4e8;
  --candle: #f2c14e;
  --pumpkin: #ff8a2a;
  --rose: #b8466f;
  --ink: #c9d3de;
  --f-display: "Pirata One", "Times New Roman", serif;
  --f-body: "IM Fell English", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: 1.15rem; line-height: 1.6; overflow: hidden; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.scene {
  position: fixed; inset: 0; z-index: 1;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; text-align: center; overflow-y: auto;
  opacity: 0; visibility: hidden; transition: opacity 1.2s ease, visibility 1.2s;
}
.scene.on { opacity: 1; visibility: visible; }
.bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; opacity: .55; }
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .03em; }
h1 { font-size: clamp(2.8rem, 12vw, 5.4rem); color: var(--moon); line-height: .95; transform: rotate(-2deg); text-shadow: 3px 3px 0 #000, 0 0 30px rgba(141,162,184,.5); }
h2 { font-size: clamp(1.9rem, 7vw, 2.9rem); color: var(--moon); transform: rotate(1deg); text-shadow: 2px 2px 0 #000; }
p { margin: 0; max-width: 34em; }
.kicker { font-size: .85rem; letter-spacing: .3em; text-transform: uppercase; color: var(--blue); }
.btn {
  font-family: var(--f-display); font-size: 1.35rem; letter-spacing: .06em; color: var(--night); background: var(--moon);
  border: 2px solid #000; border-radius: 0; padding: .5em 1.5em; cursor: pointer; box-shadow: 4px 4px 0 var(--ash);
  transition: transform .15s, box-shadow .15s; transform: rotate(-1deg);
}
.btn:hover { transform: rotate(1deg) translateY(-2px); box-shadow: 6px 6px 0 var(--blue); }
.ghost { background: transparent; color: var(--moon); border-color: var(--ash); box-shadow: none; }
:focus-visible { outline: 2px solid var(--candle); outline-offset: 3px; }
.stripes { background-image: repeating-linear-gradient(90deg, rgba(232,230,216,.07) 0 10px, transparent 10px 20px); }

/* Portada */
.moon {
  position: absolute; top: calc(5% + env(safe-area-inset-top, 0px)); left: 50%; translate: -50% 0; z-index: -1;
  width: min(58vw, 320px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 38% 34%, #fff, var(--moon) 50%, #a4a898);
  box-shadow: 0 0 80px 18px rgba(127,196,232,.28); animation: breathe 7s ease-in-out infinite;
}
.moon::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 70% 60%, rgba(0,0,0,.12) 0 12%, transparent 13%), radial-gradient(circle at 30% 70%, rgba(0,0,0,.1) 0 8%, transparent 9%); }
@keyframes breathe { 50% { box-shadow: 0 0 110px 32px rgba(127,196,232,.4); } }
.scenery { position: absolute; left: 0; bottom: 0; width: 100%; height: 48%; z-index: -1; }
#s-door { justify-content: flex-end; padding-bottom: calc(13vh + env(safe-area-inset-bottom, 0px)); }
.title-block { display: flex; flex-direction: column; gap: .8rem; align-items: center; }

/* Sobre */
.envelope { position: relative; width: min(84vw, 360px); aspect-ratio: 3/2; cursor: pointer; border: 0; background: none; padding: 0; perspective: 800px; }
.env-back, .env-front, .env-flap { position: absolute; inset: 0; }
.env-back { background: #232c42; box-shadow: 0 20px 50px rgba(0,0,0,.7); border: 2px solid #000; }
.env-front { background: repeating-linear-gradient(90deg, #2c3652 0 14px, #232c42 14px 28px); clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); }
.env-flap { background: #36425f; clip-path: polygon(0 0, 100% 0, 50% 58%); transform-origin: top; transition: transform .9s ease, z-index 0s .45s; z-index: 3; }
.seal { position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 4; width: 22%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #d9648c, var(--rose) 60%, #6e2542); border: 2px solid #000; display: grid; place-items: center; animation: pulse 2.2s ease-in-out infinite; transition: opacity .4s; }
@keyframes pulse { 50% { scale: 1.12; } }
.envelope.open .env-flap { transform: rotateX(180deg); z-index: 1; }
.envelope.open .seal { opacity: 0; animation: none; pointer-events: none; }
.paper { position: absolute; left: 6%; right: 6%; bottom: 8%; height: 80%; background: var(--moon); z-index: 2; transition: transform 1s ease .5s; }
.envelope.open .paper { transform: translateY(-62%); }
.hint { font-size: .95rem; color: var(--blue); }

/* Carta */
.letter { background: var(--moon); color: #1d2230; width: min(100%, 560px); max-height: 68vh; overflow-y: auto; padding: 1.6rem 1.4rem; text-align: left; box-shadow: 8px 8px 0 #000; border: 2px solid #000; font-size: 1.12rem; transform: rotate(-.6deg); }
.letter p { max-width: none; margin-bottom: 1rem; }
.letter .to { font-family: var(--f-display); font-size: 1.8rem; margin-bottom: .6rem; }
.letter .sign { font-family: var(--f-display); font-size: 1.6rem; text-align: right; }
.caret::after { content: "|"; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Jardín */
#s-yard { justify-content: flex-start; padding-top: calc(28px + env(safe-area-inset-top, 0px)); }
.progress { font-size: .95rem; letter-spacing: .15em; color: var(--blue); }
.stones { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 1rem; width: min(100%, 640px); }
.stone { font-family: var(--f-display); font-size: 1.7rem; color: var(--moon); background: linear-gradient(#3a465f, #232c42); border: 2px solid #000; box-shadow: 4px 4px 0 #000; border-radius: 60px 60px 2px 2px; aspect-ratio: 3/4; display: grid; place-items: center; cursor: pointer; transition: transform .25s; overflow: hidden; background-size: cover; background-position: center; }
.stone:nth-child(odd) { transform: rotate(-3deg); } .stone:nth-child(even) { transform: rotate(2.5deg); }
.stone:hover { transform: rotate(0) translateY(-5px); }
.stone.seen { border-color: var(--blue); color: var(--blue); }
.relics { display: flex; gap: 1.4rem; justify-content: center; }
.relic { background: none; border: 0; padding: 6px; cursor: pointer; opacity: .3; transition: opacity .3s, transform .3s, filter .3s; }
.relic svg { width: 48px; height: 48px; display: block; }
.relic:hover { opacity: .8; transform: scale(1.12) rotate(6deg); }
.relic.found { opacity: 1; filter: drop-shadow(0 0 10px currentColor); }
.relic[data-k="skull"] { color: var(--moon); } .relic[data-k="flower"] { color: var(--blue); } .relic[data-k="pumpkin"] { color: var(--pumpkin); }

/* Voto */
#s-vow { gap: 1rem; }
.candles { display: flex; gap: clamp(.6rem, 4vw, 1.6rem); justify-content: center; align-items: flex-end; flex-wrap: wrap; }
.candle { background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: .4rem; color: var(--ash); font-family: var(--f-display); font-size: 1.15rem; padding: 4px; width: 7.6rem; }
.candle svg { width: 62px; height: 108px; overflow: visible; }
.flame { opacity: 0; transform-origin: 50% 100%; transition: opacity .6s; }
.candle.lit .flame { opacity: 1; animation: flicker .18s infinite alternate; }
.candle.lit { color: var(--candle); }
@keyframes flicker { to { transform: scale(1.08, .94) rotate(2deg); } }
.vow-lines { min-height: 7.5em; display: flex; flex-direction: column; gap: .5rem; font-size: 1.3rem; color: var(--moon); font-style: italic; }
.vow-lines p { opacity: 0; transition: opacity 1.2s; margin-inline: auto; }
.vow-lines p.on { opacity: 1; }
.hand { width: 120px; color: var(--moon); margin-bottom: -2rem; transform: translateY(120%); transition: transform 1.6s ease; }
.hand.up { transform: none; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(5,6,12,.85); overflow-y: auto; }
.modal[hidden] { display: none; }
.card { background: var(--night-2); border: 2px solid var(--ash); box-shadow: 8px 8px 0 #000; padding: 1.4rem; max-width: 460px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 1rem; align-items: center; }
.card .date { color: var(--blue); font-size: .9rem; letter-spacing: .2em; text-transform: uppercase; }
.card img { max-width: 100%; max-height: 40vh; border: 2px solid #000; }

/* Final */
#s-end h1 { color: var(--candle); text-shadow: 3px 3px 0 #000, 0 0 40px rgba(242,193,78,.55); }
.promise { font-size: 1.3rem; color: var(--moon); }
.heart { width: 76px; color: var(--rose); filter: drop-shadow(0 0 16px var(--rose)); animation: pulse 1.8s ease-in-out infinite; }

#music { position: fixed; z-index: 20; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); font-size: .9rem; padding: .25em .8em; }
#edit-btn { position: fixed; z-index: 20; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); font-size: .9rem; padding: .25em .8em; }

/* Editor */
.editor { position: fixed; inset: 0; z-index: 40; background: var(--night); overflow-y: auto; padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.editor[hidden] { display: none; }
.editor-in { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: .9rem; font-size: 1rem; }
.editor label { display: flex; flex-direction: column; gap: .25rem; color: var(--blue); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; min-width: 0; }
.editor input[type=text], .editor textarea { font: inherit; font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--moon); background: var(--night-2); border: 1px solid var(--ash); padding: .5em .6em; width: 100%; min-width: 0; }
.editor textarea { min-height: 5.5em; resize: vertical; }
.mem { border: 1px dashed var(--ash); padding: .8rem; display: flex; flex-direction: column; gap: .6rem; }
.row { display: flex; gap: .6rem; flex-wrap: wrap; }
.editor .btn { font-size: 1.05rem; padding: .35em 1em; }
.editor h2 { text-align: left; transform: none; font-size: 1.8rem; }
.thumb { max-height: 70px; align-self: flex-start; border: 1px solid var(--ash); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: .01s !important; } }
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<button id="music" class="btn ghost" type="button" aria-pressed="false">Música: apagada</button>
<button id="edit-btn" class="btn ghost" type="button" hidden>Editar</button>

<!-- 1. La puerta -->
<section class="scene on" id="s-door">
  <div class="bg" id="bg-door"></div>
  <div class="moon"></div>
  <svg class="scenery" viewBox="0 0 400 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 200V120Q90 70 200 110T400 90V200Z" fill="#070910"/>
    <!-- espiral en la colina -->
    <path d="M200 160c-46 0-58-34-18-44s64 22 22 34-34-12-12-16" fill="none" stroke="#2a3550" stroke-width="3"/>
    <!-- árbol retorcido -->
    <path d="M70 200c4-40 2-70-8-96-8-6-20-8-26-20M62 104c10-8 14-20 10-34M62 104c14 2 26-2 34-14M70 150c-14-6-24-6-32-20" fill="none" stroke="#070910" stroke-width="6" stroke-linecap="round"/>
    <!-- casa torcida -->
    <path d="M300 118V78l-8-8 12-30 14 22 12-20 10 24-6 14v38z" fill="#0f1322"/>
    <path d="M318 96h8v10h-8z" fill="#f2c14e" opacity=".85"/>
    <path d="M296 70l22-44 22 44z" fill="#0b0e1a"/>
  </svg>
  <div class="title-block">
    <span class="kicker" id="t-kicker"></span>
    <h1 id="t-title"></h1>
    <p id="t-sub"></p>
  </div>
  <button class="btn" id="go-door" type="button">Cruzar la puerta</button>
</section>

<!-- 2. El sobre -->
<section class="scene" id="s-env">
  <span class="kicker">Algo te espera</span>
  <button class="envelope" id="envelope" type="button" aria-label="Abrir el sobre">
    <div class="env-back"></div><div class="paper"></div><div class="env-front"></div><div class="env-flap"></div>
    <div class="seal"><svg viewBox="0 0 24 24" width="55%" fill="#f6d6e1" aria-hidden="true"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z"/></svg></div>
  </button>
  <p class="hint" id="env-hint">Toca el sello</p>
</section>

<!-- 3. La carta -->
<section class="scene" id="s-letter">
  <div class="letter" id="letter" tabindex="0"></div>
  <button class="btn" id="go-yard" type="button" hidden>Seguir el camino</button>
</section>

<!-- 4. El jardín -->
<section class="scene" id="s-yard">
  <span class="kicker">Nuestra historia</span>
  <h2>El jardín de los recuerdos</h2>
  <p id="yard-hint"></p>
  <div class="stones" id="stones"></div>
  <div class="relics" aria-label="Objetos escondidos">
    <button class="relic" data-k="skull" type="button" aria-label="Una calavera"><svg viewBox="0 0 48 48" fill="currentColor"><path fill-rule="evenodd" d="M24 4C13 4 6 12 6 22c0 6 3 10 8 12v6h6v-4h2v4h6v-4h2v4h6v-6c5-2 8-6 8-12C44 12 35 4 24 4zM16 20a4.5 4.5 0 1 0 .1 0zm16 0a4.5 4.5 0 1 0 .1 0zM24 27l-3 5h6z"/></svg></button>
    <button class="relic" data-k="flower" type="button" aria-label="Una flor azul"><svg viewBox="0 0 48 48" fill="currentColor"><g transform="translate(24 20)"><ellipse rx="6" ry="12" cy="-8"/><ellipse rx="6" ry="12" cy="-8" transform="rotate(72)"/><ellipse rx="6" ry="12" cy="-8" transform="rotate(144)"/><ellipse rx="6" ry="12" cy="-8" transform="rotate(216)"/><ellipse rx="6" ry="12" cy="-8" transform="rotate(288)"/></g><circle cx="24" cy="20" r="4" fill="#0d1018"/><path d="M23 30h2v16h-2z"/></svg></button>
    <button class="relic" data-k="pumpkin" type="button" aria-label="Una calabaza"><svg viewBox="0 0 48 48" fill="currentColor"><path d="M22 6h4l1 6h-6z"/><ellipse cx="24" cy="28" rx="20" ry="16"/><path fill="#0d1018" d="M15 24l5 6h-8zM33 24l5 6h-8zM14 36q10 6 20 0l-3-3-3 2-4-3-4 3-3-2z"/></svg></button>
  </div>
  <p class="progress" id="progress"></p>
  <button class="btn" id="go-vow" type="button" hidden>Ir al altar</button>
</section>

<!-- 5. El voto -->
<section class="scene" id="s-vow">
  <div class="bg" id="bg-vow"></div>
  <span class="kicker">El voto</span>
  <h2 id="vow-title"></h2>
  <p id="vow-hint">Enciende cada vela y recita conmigo.</p>
  <div class="candles" id="candles"></div>
  <div class="vow-lines" id="vow-lines"></div>
  <svg class="hand" id="hand" viewBox="0 0 100 130" aria-hidden="true" fill="currentColor"><path d="M44 130V82c-6-6-14-12-16-22-1-5 3-8 7-6l7 6V22c0-5 6-5 7 0v26l2-30c1-5 8-5 8 0l-1 30 4-24c1-5 8-4 8 1l-4 28 8-14c3-4 8-1 6 3-4 12-8 22-14 32v38z"/></svg>
  <button class="btn" id="go-end" type="button" hidden>Tomar su mano</button>
</section>

<!-- 6. Final -->
<section class="scene" id="s-end">
  <div class="bg" id="bg-end"></div>
  <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-8-5.4-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.6-8 11-8 11z"/></svg>
  <h1 id="end-title"></h1>
  <p class="promise" id="end-text"></p>
  <p id="end-promise"></p>
  <p class="kicker" id="end-sign"></p>
</section>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true">
    <span class="date" id="m-date"></span>
    <h2 id="m-title"></h2>
    <img id="m-img" alt="" hidden>
    <p id="m-text"></p>
    <button class="btn ghost" id="m-close" type="button">Guardar</button>
  </div>
</div>

<!-- Editor -->
<div class="editor" id="editor" hidden>
  <div class="editor-in" id="editor-in"></div>
</div>

<script>
/* ============ EDITA AQUÍ ============
   Todo el contenido está en este bloque. También puedes editarlo desde el botón "Editar"
   de la página (EDITOR = true); lo que cambies ahí se guarda en tu navegador.
   Antes de enviárselo, pon EDITOR = false para que el botón no aparezca. */
const EDITOR = true;

const CONFIG = {
  ella: "mi amor",                 // cómo le dices cariñosamente
  yo: "Tu nombre o apodo",         // cómo firmas
  fecha: "24 de octubre",          // fecha del aniversario
  portada: {
    kicker: "Feliz aniversario",
    titulo: "Entre sombras y estrellas",
    subtitulo: "Hay un mundo escondido detrás de esta puerta. Es solo nuestro."
  },
  carta: [
    "Cada historia oscura necesita una luz, y la mía eres tú.",
    "Escribe aquí lo que de verdad quieres decirle: cómo la conociste, qué sentiste, qué te hace reír de ella.",
    "Cambia este texto por tus palabras. Se escribirá solo, letra por letra, cuando abra el sobre.",
    "Gracias por cada día de este tiempo juntos."
  ],
  // Cada recuerdo es una lápida. "img" acepta la ruta de una imagen junto al archivo (img/foto1.jpg)
  // o puedes subirla desde el editor.
  recuerdos: [
    { fecha: "Primer encuentro", titulo: "El día que te vi", texto: "Cuéntale aquí cómo fue ese primer momento.", img: "" },
    { fecha: "Primera cita", titulo: "Nuestra primera noche", texto: "Un detalle que solo ustedes dos recuerdan.", img: "" },
    { fecha: "Un viaje", titulo: "Ese lugar", texto: "Un recuerdo que les hizo reír hasta llorar.", img: "" },
    { fecha: "Una broma", titulo: "Nuestro chiste", texto: "Algo que solo ustedes entienden.", img: "" },
    { fecha: "Hoy", titulo: "Todo lo que somos", texto: "Lo que sientes hoy por ella.", img: "" }
  ],
  secretos: {
    skull:   { titulo: "La calavera", texto: "Hasta la eternidad, contigo." },
    flower:  { titulo: "La flor azul", texto: "Me recuerdas a algo que nunca se marchita." },
    pumpkin: { titulo: "La calabaza", texto: "Contigo hasta el otoño más frío se siente cálido." }
  },
  // El voto: tres velas, tres frases. Inspirado en la ceremonia de El cadáver de la novia,
  // escrito con palabras propias. Cámbialo por el tuyo.
  voto: {
    titulo: "Con esta mano…",
    velas: [
      { nombre: "La vela", linea: "Con esta vela, encenderé tu camino cuando todo esté oscuro." },
      { nombre: "El anillo", linea: "Con este anillo, te pido que camines a mi lado." },
      { nombre: "La mano", linea: "Con esta mano, levantaré tus penas y sostendré tus alegrías." }
    ]
  },
  final: {
    titulo: "Te amo",
    texto: "Esta es tu sorpresa final.",
    promesa: "Escribe aquí tu promesa, tu dedicatoria o la invitación a un plan juntos.",
    firma: "Siempre tuyo"
  },
  // Imágenes de fondo opcionales (ruta o vacío). Se muestran atenuadas detrás del texto.
  fondos: { puerta: "", voto: "", final: "" },
  musicaArchivo: ""   // ruta a un mp3, o vacío para la cajita de música generada
};
/* ============ FIN DE LA ZONA EDITABLE ============ */

const $ = (id) => document.getElementById(id);
const STORE = "cuento-aniversario-v2";
const clone = (o) => JSON.parse(JSON.stringify(o));
let C = clone(CONFIG);
try { const s = localStorage.getItem(STORE); if (s) C = Object.assign(C, JSON.parse(s)); } catch (e) {}
function saveCfg() { try { localStorage.setItem(STORE, JSON.stringify(C)); return true; } catch (e) { return false; } }

function bg(id, url) { if (url) $(id).style.backgroundImage = `url("${url}")`; }
bg("bg-door", C.fondos.puerta); bg("bg-vow", C.fondos.voto); bg("bg-end", C.fondos.final);

$("t-kicker").textContent = C.portada.kicker;
$("t-title").textContent = C.portada.titulo;
$("t-sub").textContent = C.portada.subtitulo;
$("vow-title").textContent = C.voto.titulo;
$("end-title").textContent = C.final.titulo + ", " + C.ella;
$("end-text").textContent = C.final.texto;
$("end-promise").textContent = C.final.promesa;
$("end-sign").textContent = C.final.firma + ", " + C.yo + " · " + C.fecha;
$("yard-hint").textContent = "Toca cada lápida para leer un recuerdo. Hay tres objetos escondidos en la oscuridad. Encuéntralos.";

function show(id) { document.querySelectorAll(".scene").forEach((s) => s.classList.toggle("on", s.id === id)); }
$("go-door").onclick = () => { show("s-env"); startMusic(); };

$("envelope").onclick = () => {
  const env = $("envelope");
  if (env.classList.contains("open")) return;
  env.classList.add("open"); $("env-hint").textContent = "";
  setTimeout(() => { show("s-letter"); typeLetter(); }, 2000);
};

let typed = false;
async function typeLetter() {
  if (typed) return; typed = true;
  const box = $("letter");
  const to = document.createElement("div"); to.className = "to"; to.textContent = "Para ti, " + C.ella + ","; box.append(to);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (const para of C.carta) {
    const p = document.createElement("p"); p.classList.add("caret"); box.append(p);
    for (const ch of para) { p.textContent += ch; if (!reduce) await new Promise((r) => setTimeout(r, 28)); box.scrollTop = box.scrollHeight; }
    p.classList.remove("caret");
  }
  const s = document.createElement("div"); s.className = "sign"; s.textContent = C.yo; box.append(s);
  box.scrollTop = box.scrollHeight; $("go-yard").hidden = false;
}
$("go-yard").onclick = () => show("s-yard");

// Jardín
const seenStones = new Set(), foundRelics = new Set();
const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
C.recuerdos.forEach((r, i) => {
  const b = document.createElement("button");
  b.className = "stone"; b.type = "button"; b.textContent = ROMAN[i] || i + 1;
  b.setAttribute("aria-label", "Recuerdo: " + r.titulo);
  b.onclick = () => {
    seenStones.add(i); b.classList.add("seen");
    if (r.img) { b.style.backgroundImage = `linear-gradient(rgba(13,16,24,.55),rgba(13,16,24,.55)), url("${r.img}")`; }
    openModal(r.fecha, r.titulo, r.texto, r.img); update();
  };
  $("stones").append(b);
});
document.querySelectorAll(".relic").forEach((b) => {
  b.onclick = () => { const k = b.dataset.k, s = C.secretos[k]; foundRelics.add(k); b.classList.add("found"); openModal("Secreto escondido", s.titulo, s.texto); update(); };
});
function update() {
  $("progress").textContent = `Recuerdos ${seenStones.size}/${C.recuerdos.length} · Secretos ${foundRelics.size}/3`;
  $("go-vow").hidden = !(seenStones.size === C.recuerdos.length && foundRelics.size === 3);
}
update();
$("go-vow").onclick = () => show("s-vow");

// Voto: velas
const lit = new Set();
C.voto.velas.forEach((v, i) => {
  const b = document.createElement("button");
  b.className = "candle"; b.type = "button";
  b.innerHTML = `<svg viewBox="0 0 60 108" aria-hidden="true">
    <path class="flame" d="M30 4c10 14 14 22 8 32-3 5-13 5-16 0-6-10 0-18 8-32z" fill="#f2c14e"/>
    <path class="flame" d="M30 20c5 7 6 11 3 15-2 2-6 2-7 0-2-4 0-8 4-15z" fill="#fff4c4"/>
    <rect x="14" y="40" width="32" height="64" fill="#e8e6d8" stroke="#000" stroke-width="3"/>
    <path d="M14 56q8 8 16 0t16 0v-4H14z" fill="#cfcdbd"/>
  </svg><span></span>`;
  b.lastChild.textContent = v.nombre;
  b.onclick = () => {
    if (lit.has(i)) return;
    lit.add(i); b.classList.add("lit");
    const p = document.createElement("p"); p.textContent = v.linea; $("vow-lines").append(p);
    requestAnimationFrame(() => p.classList.add("on"));
    if (lit.size === C.voto.velas.length) {
      $("vow-hint").textContent = "";
      setTimeout(() => $("hand").classList.add("up"), 900);
      setTimeout(() => { $("go-end").hidden = false; }, 2600);
    }
  };
  $("candles").append(b);
});
$("go-end").onclick = () => { show("s-end"); burst(); };

function openModal(date, title, text, img) {
  $("m-date").textContent = date; $("m-title").textContent = title; $("m-text").textContent = text;
  $("m-img").hidden = !img; if (img) $("m-img").src = img;
  $("modal").hidden = false; $("m-close").focus();
}
$("m-close").onclick = () => { $("modal").hidden = true; };
$("modal").onclick = (e) => { if (e.target === $("modal")) $("modal").hidden = true; };
addEventListener("keydown", (e) => { if (e.key === "Escape") $("modal").hidden = true; });

// Partículas
const cv = $("fx"), cx = cv.getContext("2d");
let W, H, parts = [], sparks = [];
function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", size); size();
for (let i = 0; i < 60; i++) parts.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + .5, vx: (Math.random() - .5) * .25, vy: -Math.random() * .3 - .05, p: Math.random() * 6, blue: Math.random() < .6 });
function burst() { for (let i = 0; i < 100; i++) sparks.push({ x: W / 2, y: H / 2, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8 - 2, l: 1, c: Math.random() < .5 ? "242,193,78" : "127,196,232" }); }
function frame(t) {
  cx.clearRect(0, 0, W, H);
  for (const p of parts) {
    p.x += p.vx + Math.sin(t / 2000 + p.p) * .2; p.y += p.vy;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    cx.fillStyle = `rgba(${p.blue ? "127,196,232" : "232,230,216"},${.3 + .3 * Math.sin(t / 700 + p.p)})`;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 7); cx.fill();
  }
  sparks = sparks.filter((s) => s.l > 0);
  for (const s of sparks) { s.x += s.vx; s.y += s.vy; s.vy += .08; s.l -= .008; cx.fillStyle = `rgba(${s.c},${s.l})`; cx.beginPath(); cx.arc(s.x, s.y, 2.5, 0, 7); cx.fill(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Música
let actx, musicOn = false, timer, audioEl;
const NOTES = [220, 261.63, 329.63, 440, 329.63, 261.63, 246.94, 293.66, 349.23, 493.88, 349.23, 293.66];
function tone(f, when) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(.08, when + .02); g.gain.exponentialRampToValueAtTime(.0001, when + 1.2);
  o.connect(g).connect(actx.destination); o.start(when); o.stop(when + 1.3);
}
function setMusic(on) {
  musicOn = on; $("music").textContent = "Música: " + (on ? "encendida" : "apagada"); $("music").setAttribute("aria-pressed", String(on));
  if (C.musicaArchivo) { audioEl = audioEl || Object.assign(new Audio(C.musicaArchivo), { loop: true }); on ? audioEl.play().catch(() => {}) : audioEl.pause(); return; }
  if (on) { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); let i = 0; timer = setInterval(() => tone(NOTES[i++ % NOTES.length], actx.currentTime + .05), 520); }
  else clearInterval(timer);
}
function startMusic() { if (!musicOn) setMusic(true); }
$("music").onclick = () => setMusic(!musicOn);

// ===== Editor dentro de la página =====
if (EDITOR) {
  $("edit-btn").hidden = false;
  $("edit-btn").onclick = openEditor;
}
function field(label, value, onInput, multiline) {
  const l = document.createElement("label"); l.append(label);
  const el = document.createElement(multiline ? "textarea" : "input");
  if (!multiline) el.type = "text";
  el.value = value; el.oninput = () => onInput(el.value); l.append(el); return l;
}
function imgPicker(get, set) {
  const wrap = document.createElement("div"); wrap.className = "row";
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.hidden = true;
  const btn = document.createElement("button"); btn.type = "button"; btn.className = "btn ghost"; btn.textContent = "Subir imagen";
  const del = document.createElement("button"); del.type = "button"; del.className = "btn ghost"; del.textContent = "Quitar";
  const th = document.createElement("img"); th.className = "thumb"; th.alt = "";
  const refresh = () => { th.hidden = !get(); if (get()) th.src = get(); };
  btn.onclick = () => inp.click(); del.onclick = () => { set(""); refresh(); };
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => { // reduce a 900px para no llenar el almacenamiento
      const k = Math.min(1, 900 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      set(c.toDataURL("image/jpeg", .82)); refresh(); URL.revokeObjectURL(url);
    };
    img.src = url;
  };
  wrap.append(btn, del, inp, th); refresh(); return wrap;
}
function openEditor() {
  const box = $("editor-in"); box.textContent = "";
  const h = (t) => { const e = document.createElement("h2"); e.textContent = t; return e; };
  box.append(h("Editar el regalo"));
  box.append(field("Cómo le dices", C.ella, (v) => C.ella = v), field("Tu nombre o apodo", C.yo, (v) => C.yo = v), field("Fecha", C.fecha, (v) => C.fecha = v));
  box.append(field("Título de portada", C.portada.titulo, (v) => C.portada.titulo = v), field("Subtítulo de portada", C.portada.subtitulo, (v) => C.portada.subtitulo = v, true));
  box.append(field("Carta (un párrafo por línea)", C.carta.join("\n"), (v) => C.carta = v.split("\n").filter(Boolean), true));
  box.append(h("Recuerdos"));
  C.recuerdos.forEach((r, i) => {
    const m = document.createElement("div"); m.className = "mem";
    m.append(field("Etiqueta", r.fecha, (v) => r.fecha = v), field("Título", r.titulo, (v) => r.titulo = v), field("Texto", r.texto, (v) => r.texto = v, true), imgPicker(() => r.img, (v) => r.img = v));
    const rm = document.createElement("button"); rm.type = "button"; rm.className = "btn ghost"; rm.textContent = "Eliminar este recuerdo";
    rm.onclick = () => { C.recuerdos.splice(i, 1); openEditor(); }; m.append(rm); box.append(m);
  });
  const add = document.createElement("button"); add.type = "button"; add.className = "btn ghost"; add.textContent = "Añadir recuerdo";
  add.onclick = () => { C.recuerdos.push({ fecha: "", titulo: "Nuevo recuerdo", texto: "", img: "" }); openEditor(); }; box.append(add);
  box.append(h("Secretos escondidos"));
  for (const k of ["skull", "flower", "pumpkin"]) box.append(field(C.secretos[k].titulo, C.secretos[k].texto, (v) => C.secretos[k].texto = v, true));
  box.append(h("El voto"));
  box.append(field("Título del voto", C.voto.titulo, (v) => C.voto.titulo = v));
  C.voto.velas.forEach((v) => box.append(field(v.nombre, v.linea, (x) => v.linea = x, true)));
  box.append(h("Final"));
  box.append(field("Título (se añade el apodo)", C.final.titulo, (v) => C.final.titulo = v), field("Texto", C.final.texto, (v) => C.final.texto = v), field("Promesa o dedicatoria", C.final.promesa, (v) => C.final.promesa = v, true), field("Firma", C.final.firma, (v) => C.final.firma = v));
  box.append(h("Fondos"));
  for (const [k, n] of [["puerta", "Fondo de la portada"], ["voto", "Fondo del voto"], ["final", "Fondo del final"]]) {
    const l = document.createElement("div"); l.className = "mem"; l.append(n, imgPicker(() => C.fondos[k], (v) => C.fondos[k] = v)); box.append(l);
  }
  const note = document.createElement("p"); note.className = "hint";
  note.textContent = "Los cambios se guardan en este navegador. Para dejarlos fijos, copia el texto y pégalo en CONFIG dentro de index.html (las imágenes subidas aquí no se copian; ponlas como archivos en una carpeta img/).";
  const row = document.createElement("div"); row.className = "row";
  const save = document.createElement("button"); save.type = "button"; save.className = "btn"; save.textContent = "Guardar y ver";
  save.onclick = () => { if (!saveCfg()) note.textContent = "No se pudo guardar en este navegador. Usa Copiar texto."; else location.reload(); };
  const copy = document.createElement("button"); copy.type = "button"; copy.className = "btn ghost"; copy.textContent = "Copiar texto";
  copy.onclick = async () => {
    const out = clone(C); out.recuerdos.forEach((r) => { if (r.img.startsWith("data:")) r.img = ""; }); Object.keys(out.fondos).forEach((k) => { if (out.fondos[k].startsWith("data:")) out.fondos[k] = ""; });
    try { await navigator.clipboard.writeText(JSON.stringify(out, null, 2)); copy.textContent = "Copiado"; } catch (e) { const t = document.createElement("textarea"); t.value = JSON.stringify(out, null, 2); box.append(t); t.select(); copy.textContent = "Selecciona y copia abajo"; }
  };
  const reset = document.createElement("button"); reset.type = "button"; reset.className = "btn ghost"; reset.textContent = "Restaurar original";
  reset.onclick = () => { try { localStorage.removeItem(STORE); } catch (e) {} location.reload(); };
  const close = document.createElement("button"); close.type = "button"; close.className = "btn ghost"; close.textContent = "Cerrar";
  close.onclick = () => { $("editor").hidden = true; };
  row.append(save, copy, reset, close); box.append(row, note);
  $("editor").hidden = false; $("editor").scrollTop = 0;
}
</script>
